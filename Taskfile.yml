# Canonical command interface (ADR-0026; contract: .ai/contracts/foundation/task-targets.md)
# wired for this template's stack:
# Next.js (App Router) + TypeScript + pnpm + Prettier + ESLint + tsc + Vitest + Prisma.
# Started from profiles/typescript-node; deliberate changes: pre-commit guarded for CI
# runners (they don't ship it), prisma generate in setup (tsc needs the client types),
# --passWithNoTests on the integration filter until integration suites exist.
version: "3"

vars:
  FILE: '{{.FILE | default ""}}'

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  # ---------------------------------------------------------------------------
  # Canonical interface (task-targets.md) — do not change semantics.
  # ---------------------------------------------------------------------------

  setup:
    desc: "Install toolchain: node deps (frozen lockfile) + prisma client + git hooks"
    cmds:
      - corepack enable
      - pnpm install --frozen-lockfile
      - pnpm exec prisma generate
      - cmd: |
          if command -v pre-commit >/dev/null 2>&1; then pre-commit install --hook-type pre-commit --hook-type pre-push; else echo "pre-commit not installed — local hooks skipped (CI runs the same gates)"; fi
        silent: true

  format:
    desc: Auto-format (all, or FILE=<path>)
    cmds:
      - cmd: pnpm exec prettier --write .
        if: '[ -z "{{.FILE}}" ]'
      - cmd: pnpm exec prettier --write "{{.FILE}}"
        if: '[ -n "{{.FILE}}" ]'

  lint:
    desc: "Check-only, zero warnings (COD-001): prettier check + eslint + types"
    cmds:
      - pnpm exec prettier --check .
      - pnpm exec eslint . --max-warnings 0
      - pnpm exec tsc --noEmit

  test:
    desc: Full suite
    cmds:
      - pnpm exec vitest run

  test-unit:
    desc: Fast suite — pre-push gate (excludes integration/e2e dirs)
    cmds:
      - pnpm exec vitest run --exclude "**/integration/**" --exclude "**/e2e/**"

  test-integration:
    desc: Integration + e2e dirs only (none yet — passes empty)
    cmds:
      - pnpm exec vitest run --dir tests --exclude "**/unit/**" --passWithNoTests

  coverage:
    desc: Tests with coverage report (TST-003 ratchet)
    cmds:
      - pnpm exec vitest run --coverage

  build:
    desc: Produce deployable artifact (next build, standalone output)
    cmds:
      - pnpm run build

  run:
    desc: Run locally
    cmds:
      - pnpm run dev

  security-scan:
    desc: "Local sweep: secrets + dependency vulns"
    cmds:
      - cmd: |
          if command -v gitleaks >/dev/null 2>&1; then gitleaks detect --no-banner; else echo "gitleaks not installed — CI still enforces SEC-002"; fi
        silent: true
      - cmd: |
          if command -v trivy >/dev/null 2>&1; then trivy fs --scanners vuln,secret --exit-code 1 .; else echo "trivy not installed — CI still enforces SEC-030"; fi
        silent: true
      - pnpm audit --audit-level high

  sbom:
    desc: SBOM (SPDX + CycloneDX) into dist/ — REL-020
    silent: true
    cmds:
      - mkdir -p dist
      - |
        if command -v syft >/dev/null 2>&1; then syft . -o spdx-json=dist/sbom.spdx.json -o cyclonedx-json=dist/sbom.cdx.json && echo "SBOM written to dist/"; else echo "syft not installed — release workflow generates the authoritative SBOM"; fi

  clean:
    desc: Remove build artifacts and caches (workspace only — GR-031)
    cmds:
      - rm -rf dist .next coverage .eslintcache node_modules/.cache

  doctor:
    desc: "Foundation self-check: metadata invariants + guard-hook tests"
    silent: true
    cmds:
      - bash scripts/template-check.sh
      - bash scripts/template-check-target.sh
      - bash scripts/tests/pr-size-policy.test.sh
      - bash .claude/hooks/tests/guard-bash.test.sh
